[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "craig-transcriber"
version = "0.3.0"
description = "Transcribe D&D sessions (Egyptian Arabic + English) and ask questions over the campaign archive."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The speech backends need torch installed first from the CUDA index, and
# QwenCleo with --no-deps -- scripts/setup.cmd does that. These extras only
# list what goes on top.
asr = ["qwen-asr>=0.0.6", "soundfile", "huggingface_hub", "silero-vad>=6.0", "pyannote.audio>=4.0"]
correct = ["google-genai>=1.0"]
rag = [
    "transformers>=4.51",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8"]

[project.scripts]
scribe = "craig_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
craig_transcriber = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
