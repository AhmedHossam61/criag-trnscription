<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · {{party}} Lore</title>
<!--icon-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css">
<script>
  try { const t = localStorage.getItem("lorekeeper.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body class="login-page">
<main class="login">
  <div class="brand">
    <!--sigil-->
    <svg class="sigil" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 2.5 27.5 16 16 29.5 4.5 16Z"/>
      <path d="M8.5 16q7.5-7.5 15 0-7.5 7.5-15 0Z"/>
      <circle cx="16" cy="16" r="2.3" class="fill"/>
    </svg><!--/sigil-->
    <span class="brand-text">
      <span class="brand-name">{{party}}</span>
      <span class="brand-sub">{{tagline}}</span>
    </span>
  </div>
  <form class="login-card" method="post" action="/login">
    <h1>Sign in</h1>
    <p class="login-error" role="alert" {{error_hidden}}>{{error}}</p>
    <label>Name
      <input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required {{name_focus}} value="{{name}}">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required {{password_focus}}>
    </label>
    <button class="btn btn-primary" type="submit">Sign in</button>
    <p class="muted small">No login yet? Ask the party's archivist for one.</p>
  </form>
</main>
</body>
</html>
