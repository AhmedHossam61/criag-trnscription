# VAKT's roster. The lore site makes a page for every character listed here:
# the four of you under "Party", the companions on their own page.
#
#   name       what everyone calls them; their page address is made from it (#kael)
#   role       "main" (a player's character) or "companion"
#   full_name  optional, e.g. "Kael Veyron"
#   player     who plays them (main characters); the Discord name is fine
#   title      one line under the name, e.g. "Bladesinger of House Veyron"
#   summary    a few sentences for the top of their page
#   sheet      their PDF (or .md / .docx), shown on their page. Leave it out and a
#              file in data/documents/characters named after them is used
#              (Hasaneen.pdf, Raddis.pdf, "Ronaldo Raddis the Third.pdf", ...)
#   portrait   an image; leave it out and assets/<name>/portrait.png (.jpg /
#              .webp) is used, or else the first image in that folder
#   aliases    other spellings, above all how the transcripts write the name in
#              Arabic. Their page lists where any of these come up in the
#              sessions, and questions using one name also search for the others.
#
# Edit freely; the site picks up changes on the next page load.

[[character]]
name = "Kael"
full_name = "Kael Veyron"
role = "main"
player = "ahmedhoss61"
title = "Bladesinger of House Veyron"
sheet = "data/documents/characters/Kael.pdf"
aliases = ["كايل"]

